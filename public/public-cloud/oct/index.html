<script src="./assets/config.js"></script><script src="./assets/loader.js"></script><script>
window.__boot=function(D){
const CLOUDS=["AWS","Azure","GCP"],COL={Azure:"var(--az)",AWS:"var(--aws)",GCP:"var(--gcp)"};
const S={tab:"ALL",period:D.defaultPeriod,from:null,to:null,client:"ALL",cat:"ALL",view:"cvr",cur:"INR",kind:"all"};
{const [h,pp]=decodeURIComponent(location.hash.slice(1)).split(":");if(["ALL","AWS","Azure","GCP"].includes(h))S.tab=h;if(/^\d{4}-\d{2}$/.test(pp||""))S.period=pp;}
const VIEW_FROM="2026-10";// Vivek 25 Nov 08:33 IST: Oct and Nov 2026 only (older rows stay in the DB, not shown)
const rows=D.rows.filter(r=>String(r.period).slice(0,7)>=VIEW_FROM).map(r=>({...r,ym:r.period.slice(0,7)}));
const months=[...new Set(rows.map(r=>r.ym))].sort();
if(!months.includes(S.period))S.period=months[months.length-1]||S.period;
S.from=months[0];S.to=months[months.length-1];
const clientKeys=[...new Set(rows.filter(r=>r.client_key!=="ALL").map(r=>r.client_key))].sort((a,b)=>(a.length-b.length)||a.localeCompare(b));
const fmtM=ym=>{const[y,m]=ym.split("-");return new Date(+y,+m-1,1).toLocaleString("en-GB",{month:"short",year:"numeric"})};
const money=(v,c)=>v==null?null:(c==="INR"?"\u20b9"+Math.round(v).toLocaleString("en-IN"):"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const short=(v,c)=>v==null?"":c==="INR"?(Math.abs(v)>=1e5?"\u20b9"+(v/1e5).toFixed(1)+"L":"\u20b9"+Math.round(v/1e3)+"k"):"$"+(Math.abs(v)>=1e3?(v/1e3).toFixed(1)+"k":Math.round(v));
const fmtTs=t=>{if(!t)return"";const d=new Date(t);return d.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+" IST"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Select rows for a scope. Returns {cost,billed,savings,as_of,est,src,clouds:{}} with nulls where no data.
function agg(ym,opts={}){
  const tab=opts.tab??S.tab, client=opts.client??S.client, cat=opts.cat??S.cat, cur=opts.cur??S.cur, kind=S.kind;
  const ck=cur==="INR"?"_inr":"_usd";
  let rs=rows.filter(r=>r.ym===ym&&(tab==="ALL"||r.cloud===tab));
  if(client==="ALL"){rs=rs.filter(r=>r.client_key==="ALL"&&(tab==="Azure"&&cat!=="ALL"?r.category===cat:r.category==="ALL"));}
  else{rs=rs.filter(r=>r.client_key===client&&(tab==="Azure"&&cat!=="ALL"?r.category===cat:true));}
  const ft=opts.ft||"main";rs=rs.filter(r=>ft==="forecast"?r.figure_type==="forecast":r.figure_type!=="forecast");
  if(kind==="actual")rs=rs.filter(r=>!r.is_estimate);if(kind==="est"&&ft==="main")rs=rs.filter(r=>r.is_estimate);
  const o={cost:null,billed:null,savings:null,review:null,reviewClouds:new Set(),mtd:false,as_of:"",est:false,srcs:new Set(),clouds:{},costClouds:new Set(),revClouds:new Set(),layer:new Set()};
  for(const r of rs){
    const c=r["cost"+ck],b=r["billed"+ck],s=r["savings_estimate"+ck];
    const cc=o.clouds[r.cloud]||(o.clouds[r.cloud]={cost:null,billed:null});
    if(c!=null){o.cost=(o.cost||0)+c;cc.cost=(cc.cost||0)+c;o.costClouds.add(r.cloud)}
    if(b!=null&&(b!==0||client!=="ALL")){o.billed=(o.billed||0)+b;cc.billed=(cc.billed||0)+b;o.revClouds.add(r.cloud)}
    if(s!=null)o.savings=(o.savings||0)+s;
    if(r.billed_under_review_inr&&cur==="INR"&&b!=null){o.review=(o.review||0)+r.billed_under_review_inr;o.reviewClouds.add(r.cloud)}
    if(r.billed_under_review_inr&&b!=null)o.reviewClouds.add(r.cloud);
    if(r.figure_type==="mtd")o.mtd=true;
    if(r.as_of>o.as_of)o.as_of=r.as_of;if(r.is_estimate)o.est=true;o.srcs.add(r.source_label);o.layer.add(r.layer);
  }
  // margin only over clouds that have BOTH cost and revenue (INR basis)
  let mc=0,mb=0,mcl=[];
  for(const [cl,v] of Object.entries(o.clouds)){if(v.cost!=null&&v.billed){mc+=v.cost;mb+=v.billed;mcl.push(cl)}}
  o.margin=mb?100*(mb-mc)/mb:null;o.ratio=mb?mc/mb:null;o.marginClouds=mcl;
  o.empty=!rs.length;return o;
}

  const dl='<div class="dl">'+vals.map(v=>'<div class="'+(v.dim?'off':'')+'"'+act("cloud",'data-cl="'+v.cl+'"',"Open "+v.cl+" tab")+'><span><i style="background:'+HEXC[v.cl]+'"></i>'+v.cl+'</span><span>'+(v.v==null?'<span class="nodata">no data</span>':money(v.v,c)+' <span class="pc">'+(100*v.v/tot).toFixed(0)+'%</span>')+'</span></div>').join("")+'</div>';
  const s2=ms.map(ym=>{const b=agg(ym,{tab:"ALL"});return{ym,stacks:CLOUDS.map(cl=>({cl,v:b.clouds[cl]?b.clouds[cl][metric]:null,color:HEXC[cl],name:cl}))}});
  out.push('<div class="card"><div class="hd"><h3>'+(S.view==="rev"?"Revenue":"Cost")+' by cloud &middot; '+mL(S.period)+'</h3></div><div class="donut">'+donut(vals,c,S.period)+dl+'</div><div class="strip"><div class="k" style="margin-bottom:6px">Over time, stacked</div>'+svgBars(s2,{cur:c,w:420,h:96,axis:false,nosel:false})+'</div><div class="note">Click a slice or segment to open that cloud. AWS and GCP cost: awaiting read-only billing access (revenue is available).</div></div>');
  const hideM=S.client!=="ALL"&&!D.showClientMargin;
  out.push('<div class="card"><div class="hd"><h3>Gross margin trend</h3><span class="k">INR &middot; like-for-like</span></div>'+(hideM?'<div class="empty">Per-client margin is hidden by policy</div>':svgArea(ms.map(ym=>{const m=marginINR(ym);return{ym,v:m.margin}}))+mstats(ms))+'<div class="note">Like-for-like: each month uses only clouds with both cost and revenue. Click a point for that month\u2019s breakdown.</div></div>');
  if(S.tab==="Azure"){
    const rs=rows.filter(r=>r.ym===S.period&&r.cloud==="Azure"&&r.category!=="ALL"&&(S.client==="ALL"?r.client_key==="ALL":r.client_key===S.client));
    const k=c==="INR"?"cost_inr":"cost_usd";const by={};rs.forEach(r=>{if(r[k]!=null)by[r.category]=(by[r.category]||0)+r[k]});
    const ent=Object.entries(by).sort((x,y)=>y[1]-x[1]);const tt=ent.reduce((x,y)=>x+y[1],0);
    const vh=(D.usage||[]).find(u=>u.period.slice(0,7)===S.period&&u.cloud==="Azure"&&u.metric==="vm_hours_running");
    out.push('<div class="card span2"><div class="hd"><h3>Azure cost by category &middot; '+mL(S.period)+' ('+c+')</h3><span class="k">click a row to filter</span></div>'+rankList(ent.map(([n,v])=>({label:n,cost:v,c2:(100*v/tt).toFixed(1)+"%",color:HEXC.Azure,sel:S.cat===n,act:act("cat",'data-c="'+esc(n)+'"',"Filter category "+n)})),c,{head:"Category",c1:"Cost",c2:"Share"})+(vh?'<div class="note">Running VM-hours (Azure, est.): '+Math.round(vh.value).toLocaleString("en-IN")+' h &middot; as of '+fmtTs(vh.as_of)+'</div>':'')+'<div class="note">Aggregated service categories only; no resource names.</div></div>');
  } else if(D.clientsAllowed&&S.client==="ALL"){
    const tot=clientData(S.period,c).reduce((x,o)=>({cost:x.cost+(o.cost||0),billed:o.billed==null?x.billed:(x.billed||0)+o.billed}),{cost:0,billed:null});
    out.push('<div class="card span2" id="p-clients"><div class="hd"><h3>By client &middot; cost vs billed &middot; '+mL(S.period)+' ('+c+')</h3><div class="lg"><span><i style="background:'+COSTC+'"></i>Cost (Azure only)</span>'+CLOUDS.map(cl=>'<span><i style="background:'+REVS[cl]+'"></i>Billed '+cl+'</span>').join("")+'<span><i style="background:'+REVS.AWS+';background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 2px,transparent 2px 5px)"></i>Billed, cost not collected</span></div></div>'+clientChart(S.period,c)+'<div class="note">Exact figures, every client with cost or billing. Totals: cost '+money2(tot.cost).replace(/^₹/,c==="INR"?"₹":"$")+' &middot; billed '+(tot.billed==null?'no billing data loaded':money(tot.billed,c))+'. Cost per client is Azure only (AWS/GCP cost not collected), so AWS/GCP revenue has no matching cost. Click a client for its detail. Per-client margin is not shown. Per-client user counts are not in the data, so users billed per client and billed per user per client cannot be shown yet.</div></div>');
  } else {
    const b=agg(S.period);
    out.push('<div class="card span2"><div class="hd"><h3>Coverage by cloud &middot; '+fmtM(S.period)+(S.client!=="ALL"?' &middot; '+esc(dn(S.client)):'')+'</h3><div class="lg"><span><i style="background:'+COSTC+'"></i>Cost</span><span><i style="background:'+REVC+'"></i>Revenue</span></div></div>'+rankList(CLOUDS.filter(cl=>S.tab==="ALL"||cl===S.tab).map(cl=>{const v=b.clouds[cl]||{};return{label:cl,cost:v.cost==null?null:v.cost,billed:v.billed==null?null:v.billed,color:HEXC[cl],act:act("cloud",'data-cl="'+cl+'"',"Open "+cl+" tab")}}),c,{head:"Cloud",c1:"Cost",c2:"Revenue",rev:true})+'<div class="note">'+(D.clientsAllowed?'':'Cloud totals only in this view.')+' "no data" means no figure exists yet; it is not zero.</div></div>');
  }
  document.getElementById("charts").innerHTML=out.join("");
}
const DR={open:false,m:null,arg:null};
const MN={cost:"Overall total",rev:"Revenue (billed)",gm:"Gross margin %",cr:"Cost / revenue",sav:"Savings estimate / month",mom:"MoM change (cost)",mp:"Like-for-like margin"};
function seriesFor(m,ym,c){
  const a=agg(ym),mi=marginINR(ym);
  if(m==="cost"){const f=agg(ym,{ft:"forecast"});return{v:a.cost==null?null:money(a.cost,c)+(a.mtd?" (MTD)":""),x:f.cost==null?"":money(f.cost,c)+" fcst",a}}
  if(m==="rev")return{v:a.billed==null?null:money(a.billed,c),a};
  if(m==="gm")return{v:mi.margin==null?null:mi.margin.toFixed(1)+"%",x:mi.marginClouds.join("+"),a:mi};
  if(m==="cr")return{v:mi.ratio==null?null:(mi.ratio*100).toFixed(1)+"%",x:mi.marginClouds.join("+"),a:mi};
  if(m==="sav"){const s=savingsAt(ym,c);return{v:s?money(s.v,c):null,a:{as_of:s?s.as_of:"",srcs:new Set(),est:true}}}
  if(m==="mom"){const p=agg(prevMonth(ym)),cmp=a.mtd?null:a.cost;const v=(cmp!=null&&p.cost)?100*(cmp-p.cost)/p.cost:null;return{v:v==null?null:(v>=0?"+":"")+v.toFixed(1)+"%",a}}
}
function openDrawer(m,arg,silent){
  if(!D.clientsAllowed&&(m==="client"||m==="cl"))return;
  DR.open=true;DR.m=m;DR.arg=arg;const c=S.cur,ms=rangeMonths();let body="",title=MN[m]||"",flags=[];
  if(D.draft)flags.push('<span class="flag d">DRAFT</span>');
  if(m==="cl"){const o=clientData(S.period,c).find(x=>x.key===arg);if(!o)return;title=esc(dn(arg))+" &middot; "+fmtM(S.period);
    const pc={};rows.filter(r=>r.ym===S.period&&r.client_key===arg).forEach(r=>{const q=pc[r.cloud]||(pc[r.cloud]={ci:null,cu:null,bi:null,bu:null});[["ci","cost_inr"],["cu","cost_usd"],["bi","billed_inr"],["bu","billed_usd"]].forEach(([k,f])=>{if(r[f]!=null)q[k]=(q[k]||0)+r[f]})});
    const cell=(v,cu)=>v==null?'<span class="nodata">no data</span>':(cu==="INR"?money2(v):money(v,"USD"));
    body='<table class="dt"><tr><th>Cloud</th><th>Cost INR</th><th>Billed INR</th><th>Billed USD</th></tr>'+CLOUDS.filter(cl=>pc[cl]).map(cl=>'<tr><td>'+cl+'</td><td>'+(pc[cl].ci==null?'<span class="nodata">not collected</span>':money2(pc[cl].ci))+'</td><td>'+cell(pc[cl].bi,"INR")+'</td><td>'+cell(pc[cl].bu,"USD")+'</td></tr>').join("")+'</table>'
      +(o.tags.length?'<div class="gapbox"><b>Gaps</b><ul>'+o.tags.map(t=>'<li>'+esc(t[1])+'</li>').join("")+'</ul></div>':'')
      +'<div class="drill" data-level="batch"><div class="k" style="margin-bottom:4px">Batches &rarr; users</div><div class="empty" style="padding:16px">Batch-level data not loaded yet. Next levels (cost and seats per batch, then pseudonymous user rows per batch) will appear here once loaded behind this private link.</div></div>'+'<div class="kv"><span>Basis</span><span>Cost: Azure Cost Management actual (Azure only). Billed: billing file lines. INR and USD separate, never added.</span><span>Margin</span><span>Per-client margin is not shown.</span></div><button class="dbtn"'+act("client",'data-c="'+esc(arg)+'"',"Filter page to "+dn(arg))+'>Filter page to this client</button>';
  } else if(m==="mp"){const ym=arg,mi=marginINR(ym);title="Margin breakdown &middot; "+fmtM(ym);
    const rr=CLOUDS.map(cl=>{const v=mi.clouds[cl]||{};const inc=mi.marginClouds.includes(cl);return'<tr><td>'+cl+(inc?'':' <span class="nodata" style="font-size:11px">(excluded)</span>')+'</td><td>'+(v.cost==null?'<span class="nodata">no data</span>':money(v.cost,"INR"))+'</td><td>'+(v.billed==null?'<span class="nodata">no data</span>':money(v.billed,"INR"))+'</td><td>'+(inc?(100*(v.billed-v.cost)/v.billed).toFixed(1)+"%":"&ndash;")+'</td></tr>'}).join("");
    if(mi.est)flags.push('<span class="flag e">ESTIMATE</span>');
    body='<table class="dt"><tr><th>Cloud</th><th>Cost</th><th>Billed</th><th>Margin</th></tr>'+rr+'</table><div class="kv"><span>Like-for-like</span><span>'+(mi.margin==null?'no cloud has both cost and revenue':mi.margin.toFixed(1)+'% over '+mi.marginClouds.join(" + "))+'</span><span>Rule</span><span>Only clouds with both cost and revenue for the month are included. INR basis.</span><span>As of</span><span>'+(fmtTs(mi.as_of)||"&ndash;")+'</span><span>Source</span><span>'+esc([...mi.srcs].join("; ")||"none")+'</span></div>';
  } else {
    const hideM=(m==="gm"||m==="cr")&&S.client!=="ALL"&&!D.showClientMargin;
    const cur=seriesFor(m,S.period,c),ca=cur.a;if(ca.est||m==="sav"||m==="mom")flags.push('<span class="flag e">ESTIMATE</span>');
    const scope=(S.tab==="ALL"?"All clouds":S.tab)+(S.client!=="ALL"?" &middot; "+esc(dn(S.client)):"")+(S.cat!=="ALL"?" &middot; "+esc(S.cat):"");
    const cov=m==="gm"||m==="cr"?(ca.marginClouds&&ca.marginClouds.length?ca.marginClouds.map(cl=>cl+" cost vs "+cl+" billed").join("; "):"no cloud has both cost and revenue")+" (INR, like-for-like)":(ca.costClouds?"cost: "+([...ca.costClouds].join(", ")||"none")+" &middot; revenue: "+([...ca.revClouds].join(", ")||"none"):"from the latest savings analysis");
    const tr=hideM?'<div class="empty">Per-client margin is hidden by policy</div>':'<table class="dt"><tr><th>Month</th><th>'+esc(MN[m])+'</th><th></th></tr>'+ms.map(ym=>{const s=seriesFor(m,ym,c);return'<tr class="'+(ym===S.period?'sel':'')+'"><td>'+fmtM(ym)+'</td><td>'+(s.v==null?'<span class="nodata">no data</span>':s.v)+'</td><td style="color:var(--mut2);font-size:11.5px">'+(s.x||"")+'</td></tr>'}).join("")+'</table>';
    const zz=m==="cost"&&c==="INR"&&S.tab==="ALL"&&S.client==="ALL"&&S.cat==="ALL"?bizFor(S.period):null;
    const pre=(zz?'<div class="kv"><span>Business total</span><span><b>'+money2(zz.total)+'</b> (draft)</span><span>Breakdown</span><span>'+bizLine(zz)+'</span><span>USD part</span><span>'+esc(zz.usdLabel)+'</span><span>Headline source</span><span>'+esc(zz.src)+'</span><span>Cloud cost</span><span>'+(ca.cost==null?'no data':money2(ca.cost))+' (Azure only)</span></div>':'')+((m==="rev"||m==="cost")&&S.client==="ALL"&&S.cat==="ALL"?gapHtml(S.period):'');
    body=pre+'<div class="kv"><span>Scope</span><span>'+scope+'</span><span>Selected</span><span>'+fmtM(S.period)+': <b>'+(hideM?'hidden':(cur.v==null?'no data':cur.v))+'</b></span><span>As of</span><span>'+(fmtTs(ca.as_of)||"&ndash;")+'</span><span>Source</span><span>'+esc([...(ca.srcs||[])].join("; ")||(m==="sav"?"Savings analysis (estimate)":"none"))+'</span><span>Coverage</span><span>'+cov+'</span>'+(m==="rev"&&agg(S.period,{cur:"INR"}).review?'<span>Review</span><span style="color:#8a5a00">&#9888; includes '+short(agg(S.period,{cur:"INR"}).review,"INR")+' line under review</span>':'')+'</div>'+tr+'<div class="note" style="font-size:11.5px;color:var(--mut2)">Monthly series over the selected trend range. "no data" means no figure exists; it is not zero.</div>';
  }
  document.getElementById("dk").innerHTML=(m==="mp"?"Gross margin":"Metric detail");document.getElementById("dt").innerHTML=title;
  document.getElementById("db").innerHTML='<div class="flags">'+flags.join("")+'</div>'+body;
  document.body.classList.add("dopen");document.getElementById("drawer").setAttribute("aria-hidden","false");
  if(!silent)setTimeout(()=>document.getElementById("dclose").focus(),50);
}
function closeDrawer(){DR.open=false;document.body.classList.remove("dopen");document.getElementById("drawer").setAttribute("aria-hidden","true")}
function onAct(el){const a=el.dataset.act;
  if(a==="tile"){openDrawer(el.dataset.m);if(el.dataset.m==="cost"){const p=document.getElementById("p-monthly");if(p){p.scrollIntoView({behavior:"smooth",block:"center"});p.classList.remove("flash");void p.offsetWidth;p.classList.add("flash")}}return}
  if(a==="month"){if(goMonth(el.dataset.ym))return;S.period=el.dataset.ym;render();return}
  if(a==="cloud"){S.tab=el.dataset.cl;if(S.tab!=="Azure")S.cat="ALL";history.replaceState(null,"","#"+S.tab);render();return}
  if(a==="mpoint"){openDrawer("mp",el.dataset.ym);return}
  if(a==="client"){if(!D.clientsAllowed)return;S.client=el.dataset.c;if(DR.open&&DR.m==="cl")closeDrawer();render();return}
  if(a==="cdrw"){if(!D.clientsAllowed)return;openDrawer("cl",el.dataset.c);return}
  if(a==="cat"){S.tab="Azure";S.cat=el.dataset.c;render();return}
  if(a==="clr"){const k=el.dataset.k;if(k==="all"){S.tab="ALL";S.client="ALL";S.cat="ALL";S.period=D.defaultPeriod;S.from=months[0];S.to=months[months.length-1];S.view="cvr";S.cur="INR";S.kind="all";if(!months.includes(S.period))S.period=months[months.length-1];history.replaceState(null,"","#ALL")}
    else if(k==="tab"){S.tab="ALL";S.cat="ALL"}else if(k==="client")S.client="ALL";else if(k==="cat")S.cat="ALL";else if(k==="period"){S.period=months.includes(D.defaultPeriod)?D.defaultPeriod:months[months.length-1]}render()}
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el){onAct(el);return}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&DR.open){closeDrawer();return}
  const el=e.target.closest&&e.target.closest("[data-act],.tab");if(el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(el.classList.contains("tab"))el.click();else onAct(el)}});
document.getElementById("ov").onclick=closeDrawer;document.getElementById("dclose").onclick=closeDrawer;
render();
};
</script></body></html>
